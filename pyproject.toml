[project]
name = "antifraud-service"
version = "0.1.0"
description = "Anti-fraud microservice: FastAPI, Redis cache, Prometheus metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.122.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.40.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
]

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]
